[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q --cov=app --cov-report=term-missing:skip-covered"

[tool.coverage.run]
omit = ["app/tests/*"]
concurrency = ["greenlet", "thread"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
