{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="panel" style="max-width:380px;margin:3rem auto">
  <h1>Log in</h1>
  {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/login">
    <p><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required autofocus></p>
    <p><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></p>
    <button type="submit">Log in</button>
  </form>
</div>
{% endblock %}
